[project]
name = "bytearmy"
version = "0.1.0"
description = "Coordinate several coding agents working on tasks in multiple projects."
requires-python = ">=3.13"
dependencies = ["fastapi", "pydantic>=2", "uvicorn"]

[project.scripts]
bytearmy = "bytearmy.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bytearmy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# An exception in a background thread must fail the test that caused it.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
line-length = 100
extend-exclude = ["spikes"]  # throwaway prototypes
